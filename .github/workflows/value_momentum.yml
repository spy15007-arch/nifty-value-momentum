name: Nifty Value Momentum Scanner

on:

  workflow_dispatch:

  schedule:
    - cron: "45 8 * * 1-5"

permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Value Momentum Scanner
        run: |
          python run_value_momentum.py

      - name: Verify Telegram message
        run: |
          echo "Checking scanner output..."
          ls -la output/
          echo ""
          echo "Telegram message:"
          cat output/telegram_message.txt

      - name: Send Telegram Message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_push.py

      - name: Verify Telegram Delivery
        run: |
          echo "Telegram push completed."

      - name: Commit scanner output
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/*.csv output/*.txt || true

          git diff --cached --quiet || git commit -m "Update value momentum scanner output"

          git push || true
