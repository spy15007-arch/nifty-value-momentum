name: Nifty Value Momentum Scanner

on:
  workflow_dispatch:
  schedule:
    # Daily-candle BTST / swing scan near the market close.
    # 3:20 PM IST primary; 3:25 PM and 3:35 PM IST backup triggers.
    # GitHub may delay scheduled events; the guard prevents duplicate scans.
    - cron: "50 9 * * 1-5"
    - cron: "55 9 * * 1-5"
    - cron: "5 10 * * 1-5"

permissions:
  actions: read
  contents: write

concurrency:
  group: nifty-value-momentum-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Prevent duplicate daily scans
        id: daily_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Manual runs must always remain available, including reruns after a
          # successful scheduled scan. Deduplicate scheduled triggers only.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: bypassing the scheduled-run duplicate guard."
            exit 0
          fi

          today_ist="$(TZ=Asia/Kolkata date +%F)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/value_momentum.yml/runs?branch=main&per_page=100")"
          successful_today="$(printf '%s' "$runs" | jq --arg today "$today_ist" --arg current "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select((.id | tostring) != $current)
              | select(.event == "schedule")
              | select(.status == "completed" and .conclusion == "success")
              | select((.created_at | fromdateiso8601 + 19800 | strftime("%Y-%m-%d")) == $today)
            ] | length
          ')"
          if [ "$successful_today" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A successful scheduled scan already exists for $today_ist (IST); skipping duplicate trigger."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No successful scheduled scan exists for $today_ist (IST); proceeding."
          fi

      - name: Checkout repository
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.daily_guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        if: steps.daily_guard.outputs.run == 'true'
        run: python -m compileall -q run_value_momentum.py scanner telegram_push.py

      - name: Run scanner unit tests
        if: steps.daily_guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Value Momentum Scanner
        if: steps.daily_guard.outputs.run == 'true'
        run: python run_value_momentum.py

      - name: Verify Telegram message
        if: steps.daily_guard.outputs.run == 'true'
        run: |
          test -s output/telegram_message.txt
          echo "Scanner output created successfully."
          cat output/telegram_message.txt

      - name: Send Telegram Message
        if: steps.daily_guard.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_push.py

      - name: Commit scanner output
        if: success() && steps.daily_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.csv output/*.txt
          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
          else
            git commit -m "Update value momentum scanner output"
            git push
          fi
