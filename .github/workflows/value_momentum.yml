name: Trading OS Value-Momentum

on:
  workflow_dispatch:

  schedule:

    # 09:45 IST
    - cron: "15 4 * * 1-5"

    # 15:15 IST
    - cron: "45 9 * * 1-5"

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Run Value Momentum Scanner
        run: |
          python run_value_momentum.py

      - name: Upload results
        uses: actions/upload-artifact@v4

        with:
          name: trading-os-value-momentum-output
          path: output/
