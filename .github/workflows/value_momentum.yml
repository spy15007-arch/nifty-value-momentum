name: Nifty Value Momentum Scanner

on:
  # cron-job.org is the sole scheduler. It dispatches this workflow at 3:20 PM IST.
  # Manual runs remain available from the GitHub Actions page.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nifty-value-momentum-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Allow external scheduler and manual runs
        id: daily_guard
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Proceeding with workflow_dispatch. cron-job.org controls the schedule."

      - name: Checkout repository
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.daily_guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        if: steps.daily_guard.outputs.run == 'true'
        run: python -m compileall -q run_value_momentum.py scanner telegram_push.py

      - name: Run scanner unit tests
        if: steps.daily_guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Value Momentum Scanner
        if: steps.daily_guard.outputs.run == 'true'
        run: python run_value_momentum.py

      - name: Verify Telegram message
        if: steps.daily_guard.outputs.run == 'true'
        run: |
          test -s output/telegram_message.txt
          echo "Scanner output created successfully."
          cat output/telegram_message.txt

      - name: Send Telegram Message
        if: steps.daily_guard.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_push.py

      - name: Commit scanner output
        if: success() && steps.daily_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.csv output/*.txt
          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
          else
            git commit -m "Update value momentum scanner output"
            git push
          fi
